# render.yaml — Render.com deployment config for TalentAI backend

services:
  - type: web
    name: talentai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: GROQ_API_KEY
        sync: false  # Set via Render dashboard
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: LLM_MODEL_FAST
        value: llama-3.1-8b-instant
      - key: CHROMA_PERSIST_DIR
        value: /tmp/chroma_store
      - key: MIN_CANDIDATES_THRESHOLD
        value: "3"
      - key: FRONTEND_URL
        value: https://talentai.vercel.app
